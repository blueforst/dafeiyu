# 可选的 X 浏览器出口；通过 COMPOSE_FILE=compose.yaml:compose.x-proxy.yaml 启用。
services:
  browser:
    image: role-workflow-browser:${BROWSER_VERSION:-0.1.12}
    environment:
      BROWSER_PROXY_SERVER: http://browser-egress:7890
    networks:
      default: {}
      browser-egress: {}
    depends_on:
      browser-egress:
        condition: service_healthy
  browser-egress:
    image: metacubex/mihomo:v1.19.33@sha256:9211361a3ed85305383288d38c05e85862d6d5a590c10007c37fc059cca82e9c
    user: "1000:1000"
    restart: unless-stopped
    command: ["-d", "/data", "-f", "/etc/mihomo/config.json"]
    volumes:
      - /var/lib/role-workflow/secrets/x-egress/config.json:/etc/mihomo/config.json:ro
      - /var/lib/role-workflow/x-egress:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    networks:
      browser-egress: {}
    healthcheck:
      test: ["CMD-SHELL", "nc -w 1 127.0.0.1 7890 </dev/null"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  default: {}
  browser-egress: {}
