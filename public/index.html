<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>角色互动工作流</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="title">角色互动工作流</span>
    <nav class="tabs" aria-label="页面">
      <a href="#/feed" data-route="feed">动态 <span id="feed-count" class="count-badge" hidden></span></a>
      <a href="#/persona" data-route="persona">人设</a>
      <a href="#/memory" data-route="memory">记忆</a>
      <a href="#/settings" data-route="settings">设置</a>
      <a href="#/billing" data-route="billing">计费</a>
    </nav>
  </div>
  <div class="top-actions">
    <span id="conn" class="conn" role="status"></span>
    <span id="status-pill" class="pill">连接中</span>
    <button id="primary-action" class="btn primary" type="button" disabled>…</button>
  </div>
</header>
<div id="notice" class="notice" role="status" hidden></div>
<span id="billing-charge-hint" class="sr-only">此操作会调用模型，并计入实际用量与费用。</span>
<main id="view"></main>
<script type="module" src="/js/app.js"></script>
</body>
</html>
