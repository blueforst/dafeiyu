[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -ac -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb-error.log
[program:openbox]
command=/usr/bin/openbox
priority=20
autorestart=true
startsecs=2
stdout_logfile=/tmp/openbox.log
stderr_logfile=/tmp/openbox-error.log
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -repeat -noxdamage -rfbport 5900 -localhost -nopw
priority=30
autorestart=true
stdout_logfile=/tmp/vnc.log
stderr_logfile=/tmp/vnc-error.log
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc-error.log
[program:broker]
command=/bin/sh /app/start-browser.sh
priority=50
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
