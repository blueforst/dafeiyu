# Staging stack for panel development. Separate project, port and data from production.
name: role-workflow-panel
services:
  app:
    image: role-workflow-app:panel-dev
    build:
      context: ../..
      target: runtime
    init: true
    environment:
      DATA_DIR: /data
      CONFIG_PATH: /config/config.json
      BROWSER_ENDPOINT: http://127.0.0.1:9
    volumes:
      - /var/lib/role-workflow-panel/app:/data
      - /var/lib/role-workflow-panel/config:/config:ro
      - /var/lib/role-workflow-panel/secrets/app:/run/role-secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
  mock-model:
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    user: "1000:1000"
    init: true
    command: ["node", "/mock/mock-model.mjs"]
    volumes:
      - ./:/mock:ro
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
  proxy:
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    user: "1000:1000"
    init: true
    command: ["node", "/mock/proxy.mjs"]
    depends_on: [app]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./:/mock:ro
      - /var/lib/role-workflow-panel/secrets/proxy:/run/staging:ro
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
