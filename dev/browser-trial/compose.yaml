name: role-workflow-browser-trial
services:
  app:
    image: ${BROWSER_TRIAL_APP_IMAGE:-role-workflow-app:0.1.12}
    init: true
    environment:
      DATA_DIR: /data
      CONFIG_PATH: /config/config.json
      BROWSER_ENDPOINT: http://browser:3001
    volumes:
      - /var/lib/role-workflow-browser-trial/app:/data
      - /var/lib/role-workflow-browser-trial/config:/config:ro
      - /var/lib/role-workflow-browser-trial/secrets/app:/run/role-secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 128
  browser:
    image: ${BROWSER_TRIAL_IMAGE:-role-workflow-browser:0.1.12}
    hostname: role-workflow-browser-trial
    init: true
    environment:
      PROFILE_DIR: /profile
      HOME: /profile
      DISPLAY: ':99'
      XDG_RUNTIME_DIR: /tmp/runtime-node
    volumes:
      - /var/lib/role-workflow-browser-trial/browser:/profile
      - /var/lib/role-workflow-browser-trial/secrets/browser:/run/role-secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    shm_size: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../../seccomp_profile.json
    mem_limit: 1280m
    pids_limit: 768
    healthcheck:
      test: ['CMD', 'node', '-e', "const fs=require('fs');fetch('http://127.0.0.1:3001/health',{headers:{'x-browser-key':fs.readFileSync('/run/role-secrets/browser_key','utf8').trim()}}).then(async r=>process.exit(r.ok&&(await r.json()).ready?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
  proxy:
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    user: '1000:1000'
    init: true
    command: ['node', '/mock/proxy.mjs']
    ports:
      - '127.0.0.1:8082:8082'
    volumes:
      - ./:/mock:ro
      - /var/lib/role-workflow-browser-trial/secrets/proxy:/run/trial:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
