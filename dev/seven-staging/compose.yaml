name: role-workflow-seven
services:
  app:
    image: role-workflow-app:seven-page-candidate
    command: [node, dist/app.js]
    user: "1000:1000"
    init: true
    environment:
      DATA_DIR: /data
      CONFIG_PATH: /config/config.json
      BROWSER_ENDPOINT: http://mock-browser:3001
      MAINTENANCE_DIR: /maintenance
    volumes:
      - /srv/role-workflow-seven/dist:/app/dist:ro
      - /srv/role-workflow-seven/public:/app/public:ro
      - /var/lib/role-workflow-seven/app:/data
      - /var/lib/role-workflow-seven/config:/config:ro
      - /var/lib/role-workflow-seven/secrets/app:/run/role-secrets:ro
      - /var/lib/role-workflow-seven/maintenance/requests:/maintenance/requests
      - /var/lib/role-workflow-seven/maintenance/results:/maintenance/results:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
  mock-browser:
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    command: [node, /mock/mock-browser.mjs]
    volumes: [./:/mock:ro]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
  mock-model:
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    command: [node, /mock/mock-model.mjs]
    volumes: [./:/mock:ro]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
  proxy:
    user: "1000:1000"
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    command: [node, /mock/proxy.mjs]
    volumes:
      - ./:/mock:ro
      - /var/lib/role-workflow-seven/secrets/app:/run/staging:ro
    ports: ["127.0.0.1:8082:8082"]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
