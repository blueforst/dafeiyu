schema: spec-driven

context: |
  文档正文、需求名称、场景名称与界面使用中文；保留 OpenSpec 解析所需的结构标题、MUST/SHALL 和 WHEN/THEN 关键字。
  项目为服务器上的单账号 X 角色互动工作流，技术栈为 TypeScript、Node.js、Fastify、SQLite、Pi AI、Camoufox/Playwright、原生 HTML/CSS/ES 模块、Docker Compose 与宿主 systemd。
  应用已发布为 0.1.16、浏览器为 0.1.15；浏览器沿用原 0.1.12 Camoufox 环境。日志已从主页面移到主程序。操作前复核实际代码、部署与账号，不把文档记录当成实时状态。
  七页代码已通过独立 staging 和生产页面/接管验收，当前 paused/draft；真实模型、Chat DOM 及平台收发尚未完成，状态以 tasks.md 和发布记录为准。七页为已发布基线；本轮候选同时实施六项后续提案，真实验收保持原任务状态。
  构建、自动化测试、批量渲染与其他高负载工作只在服务器执行。本机编辑文档、源码及进行轻量浏览器互动。
  保留未提交工作、已有服务商及模型会话兼容行为；沿用现有鉴权、Key 掩码、人工接管、暂停和 unknown 只回查语义。
  生产基线仍为七页；simplify-panel-activity-feed 候选采用动态、人设、记忆、设置、计费五页，模型、任务、接管与排查并入设置。
  静态与触发提示词分层，触发由 LLM 语义判断；虚构日程也由 LLM 每天生成。所有 LLM 用途统一计量，只采用 Pi 内置价格，未知价格显示未定价。
  真实验收使用正常生产流程，不设测试账号白名单，不恢复预期账号配置；通过后保持自动运行。验证代码、模型请求、平台读取、实际发送与回执是不同证据等级。
  原七页计划是迁移来源，OpenSpec 提案及增量规格是后续规划入口；未完成的提案不得提前同步成已实现规格或归档。
rules:
  proposal:
    - 明确已有能力与新增或改变的行为，能力目录与增量规格一一对应。
    - 不扩大已确认范围；默认时间、开关和失败行为来自本轮已确认计划。
  specs:
    - 只写外部可观察的行为与可验证场景，实现细节放入 design。
    - 每个需求使用 MUST 或 SHALL，每个需求至少一个四级 Scenario；新增能力 Purpose 至少五十字符。
    - 修改已有能力时保留完整需求与场景，不能把未实现能力提前写进主规格。
  design:
    - 说明数据流、接口、状态、副作用、兼容迁移、失败处理、验证和回退。
    - 保留 OpenCode 会话路由、默认 4096 token 和 CommandCode 未定价等现有行为。
  tasks:
    - 使用分组和编号复选框；每项可独立验收，标明服务器测试及真实平台验收边界。
    - 全部业务实现初始未完成，不能把文件存在或 CLI 规划完成当成实施完成。
operations:
  apply:
    guidance:
      - 先读项目 AGENTS.md、提案、完整增量规格、设计和任务，再在用户授权范围内实施。
      - 保护已有工作，先在服务器独立环境验证；不得用真实生产账号跑模拟测试。
  archive:
    guidance:
      - 核对任务和验收证据，未完成工作不得归档或宣称完成。
