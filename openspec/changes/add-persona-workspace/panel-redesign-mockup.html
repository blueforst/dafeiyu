<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面板改版草图</title>
<style>
html,body{margin:0;height:100%;background:#fff}
@media (prefers-color-scheme: dark){html,body{background:#151517}}
iframe{display:block;width:100%;height:100%;border:0}
iframe[hidden]{display:none}
</style>
</head>
<body>
<!-- 动态、人设、设置三页草图合在一个文件里；每页各自独立，点顶栏切换。 -->
<iframe id="p-feed" title="动态" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;动态&lt;/title&gt;
&lt;style&gt;

:root{
  --bg:#ffffff; --side:#f9fafb; --hover:rgba(38,49,72,.06); --active:#ebeef2; --card:#f5f7fa;
  --l1:#0f1115; --l2:#61666b; --l3:#81858c; --cap:#adb2b8;
  --b2:rgba(0,0,0,.08); --b3:rgba(0,0,0,.12);
  --bubble:#edf3fe; --brand:#4176e6; --brand-soft:#e4edfd; --sel:#f5f8fe;
  --ok:#22c55e; --ok-soft:#e6faed; --okt:#15803d; --warn:#dd8629; --warn-bg:#fef5e7; --err:#dc2626; --err-bg:#fef2f2;
  --shadow:0 4px 20px rgba(15,17,21,.06),0 1px 2px rgba(15,17,21,.04); --pop:0 12px 32px rgba(15,17,21,.14),0 0 0 1px rgba(0,0,0,.06);
  --topbar:#ffffff; --panel-border:#e5e7eb; --primary:#0f1115; --primary-t:#fff; --mask:rgba(15,17,21,.24);
  --lw:232px; --rw:0px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151517; --side:#1b1b1c; --hover:rgba(255,255,255,.06); --active:#2c2c2e; --card:#1f1f21;
    --l1:#f9fafb; --l2:#adb2b8; --l3:#81858c; --cap:#61666b;
    --b2:rgba(255,255,255,.08); --b3:rgba(255,255,255,.16);
    --bubble:#283142; --brand:#7aaaff; --brand-soft:#28314a; --sel:#1d2230;
    --ok-soft:#233c2c; --okt:#4ade80; --warn-bg:#27241f; --err:#f87171; --err-bg:#3a1d1d;
    --shadow:0 0 0 1px rgba(255,255,255,.06); --pop:0 12px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
    --topbar:#141417; --panel-border:#26262b; --primary:#f9fafb; --primary-t:#0f1115; --mask:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--l1);font:14px/1.55 -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 面板顶栏（本提案不变） ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:16px;padding:9px 20px;background:var(--topbar);border-bottom:1px solid var(--panel-border);min-width:0}
.topbar b{font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow:auto}
.tabs span{padding:5px 12px;border-radius:7px;color:var(--l3);white-space:nowrap}
.tabs span.on{background:var(--active);color:var(--l1);font-weight:600}
.state{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}

/* ---------- 工作区：左栏 + 主区 + 可选右栏 ---------- */
body[data-mode=&quot;chat&quot;]{--rw:288px}
body[data-left=&quot;closed&quot;]{--lw:0px}
body[data-right=&quot;closed&quot;]{--rw:0px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);position:relative}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.leftcol{grid-column:1;background:var(--side);border-right:1px solid var(--b2)}
.maincol{grid-column:2}
.rightcol{grid-column:3;border-left:1px solid var(--b2)}
body[data-left=&quot;closed&quot;] .leftcol,body[data-right=&quot;closed&quot;] .rightcol,body:not([data-mode=&quot;chat&quot;]) .rightcol{display:none}
.h{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-bottom:1px solid var(--b2);min-width:0}
.body{flex:1;min-height:0;overflow:auto}
[data-m]{display:none !important}
body[data-mode=&quot;persona&quot;] [data-m~=&quot;persona&quot;],body[data-mode=&quot;daily&quot;] [data-m~=&quot;daily&quot;],body[data-mode=&quot;chat&quot;] [data-m~=&quot;chat&quot;]{display:flex !important}
:not(body)[data-pv]{display:none !important}
body[data-pv=&quot;edit&quot;] [data-pv~=&quot;edit&quot;],body[data-pv=&quot;preset&quot;] [data-pv~=&quot;preset&quot;],body[data-pv=&quot;hints&quot;] [data-pv~=&quot;hints&quot;],body[data-pv=&quot;replay&quot;] [data-pv~=&quot;replay&quot;]{display:flex !important}
:not(body)[data-dv]{display:none !important}
body[data-dv=&quot;today&quot;] [data-dv~=&quot;today&quot;],body[data-dv=&quot;past&quot;] [data-dv~=&quot;past&quot;]{display:flex !important}
.expand-left{display:none !important}
body[data-left=&quot;closed&quot;] .expand-left{display:grid !important}

.seg{display:inline-flex;padding:2px;gap:1px;background:var(--active);border-radius:8px;flex:1}
.seg button{flex:1;padding:3px 0;border-radius:6px;color:var(--l3);font-size:12.5px}
.seg button.on{background:var(--bg);color:var(--l1);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:500}
.iconbtn{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;color:var(--l2);flex:none;position:relative}
.iconbtn:hover,.iconbtn.on{background:var(--hover)}
.iconbtn:focus-visible,.btn:focus-visible,.item:focus-visible,.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.sp{flex:1}
.who{font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.who small{font-weight:400;color:var(--l3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 12px;border-radius:99px;border:1px solid var(--b3);background:var(--bg);color:var(--l1);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--primary);color:var(--primary-t);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fee{font-size:9.5px;border:1px solid currentColor;border-radius:3px;padding:0 3px;opacity:.6}
.badge{font-size:11px;padding:0 6px;border-radius:5px;background:var(--active);color:var(--l2);font-weight:400;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--okt)}
.badge.b{background:var(--brand-soft);color:var(--brand)}
.badge.w{background:var(--warn-bg);color:var(--warn)}
.unsaved{font-size:12px;color:var(--warn);white-space:nowrap}
.avatar{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

/* 左栏列表 */
.list{display:flex;flex-direction:column;gap:1px;padding:8px 6px}
.grp{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--l3);padding:6px 2px 4px 8px}
.item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:13px;text-align:left;width:100%}
.item:hover{background:var(--hover)}
.item.on{background:var(--active)}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item time,.item .c{font-size:11.5px;color:var(--cap);white-space:nowrap}
.item.tpl{color:var(--l2)}
.pin{margin-top:auto;border-top:1px solid var(--b2);padding:6px}

/* 弹出菜单 */
.menu{position:absolute;z-index:30;top:32px;right:0;min-width:180px;background:var(--bg);border-radius:12px;box-shadow:var(--pop);padding:5px;display:none;flex-direction:column}
.menu.open{display:flex}
.menu button{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;font-size:13px;text-align:left;white-space:nowrap}
.menu button:hover{background:var(--hover)}
.menu button[disabled]{opacity:.45;cursor:not-allowed}
.menu small{display:block;color:var(--cap);font-size:11px}
.menu hr{border:0;border-top:1px solid var(--b2);margin:4px 2px}
.menu .danger{color:var(--err)}

/* 人设配置页 */
.cfg{max-width:1120px;margin:0 auto;padding:16px 24px 32px;display:flex;flex-direction:column;gap:18px}
.cfg h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.cfg h3 small{font-weight:400;color:var(--l3);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:10px 12px;min-width:0}
.card b{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.card b span{font-weight:400;color:var(--cap);font-size:11.5px}
.ta{margin-top:6px;background:var(--bg);border:1px solid var(--b2);border-radius:9px;padding:7px 9px;font-size:12.5px;line-height:1.6;color:var(--l2);height:76px;overflow:hidden}
.ro .ta{background:transparent;border-style:dashed}
.trig{display:flex;flex-direction:column;border:1px solid var(--b2);border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:30px minmax(80px,150px) 56px minmax(0,1fr) 16px;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--b2);font-size:12.5px}
.tr:first-child{border-top:0}
.tr .k{color:var(--l3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:26px;height:15px;border-radius:99px;background:var(--brand);position:relative;display:inline-block}
.sw::after{content:&quot;&quot;;position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff}
.sw.off{background:var(--b3)}
.sw.off::after{right:auto;left:2px}
.fold{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--l3);padding:8px 12px;border:1px dashed var(--b3);border-radius:12px}
.notice{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:8px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn)}
.bio{display:flex;align-items:center;gap:10px;font-size:13px}
.bio code{font-family:inherit;background:var(--bg);border:1px solid var(--b2);border-radius:8px;padding:4px 10px;flex:1}
.hints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:2px 0}
.hrow .num{margin-left:auto;width:64px;text-align:right;border:1px solid var(--b2);border-radius:8px;padding:2px 8px;background:var(--bg);font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--l3);font-size:13px;padding:60px 20px;text-align:center}

/* 日程 */
.day{max-width:1120px;margin:0 auto;padding:16px 24px 32px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.tl{display:flex;flex-direction:column;border:1px solid var(--b2);border-radius:14px;overflow:hidden}
.tl div{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--b2);font-size:13px}
.tl div:first-child{border-top:0}
.tl div span{color:var(--l3);font-variant-numeric:tabular-nums;font-size:12.5px}
.tl div.now{background:var(--sel)}
.tl div.now span{color:var(--brand);font-weight:500}
.kvs{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--active);color:var(--l2)}

/* 试聊 */
.thread{max-width:760px;margin:0 auto;padding:14px 20px 6px;display:flex;flex-direction:column;gap:10px}
.user{align-self:flex-end;display:flex;align-items:flex-end;gap:6px;max-width:80%}
.user .meta{order:-1;padding-bottom:4px}
.bubble{background:var(--bubble);border-radius:18px;padding:7px 14px;line-height:21px;overflow-wrap:anywhere}
.meta{font-size:11.5px;color:var(--cap);display:flex;gap:5px;align-items:center;white-space:nowrap}
.tag{font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--active);color:var(--l2)}
.tag.dm{background:var(--brand-soft);color:var(--brand)}
.turn{display:flex;flex-direction:column;gap:3px;padding:6px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;text-align:left}
.turn:hover{background:var(--hover)}
.turn.sel{background:var(--sel)}
.proc{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--l3)}
.proc .ok{color:var(--ok)}
.proc .hit{font-size:11px;padding:0 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand)}
.proc .d{width:2px;height:2px;border-radius:1px;background:var(--cap)}
.reply{line-height:23px;overflow-wrap:anywhere}
.pills{font-size:11.5px;color:var(--cap);font-variant-numeric:tabular-nums}
.skip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--l3);padding:4px 10px;border:1px dashed var(--b3);border-radius:10px;width:fit-content}
.warnline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:7px;width:fit-content}
.sys{align-self:center;font-size:11.5px;color:var(--l3);padding:2px 10px;border-radius:99px;background:var(--side);border:1px solid var(--b2)}
.merged{font-size:11px;color:var(--cap)}
.dock{flex:none;padding:4px 20px 12px}
.composer{max-width:760px;margin:0 auto;border:1px solid var(--b3);border-radius:16px;background:var(--bg);box-shadow:var(--shadow);padding:8px 8px 6px 12px}
.ph{color:var(--cap);padding:2px 2px 8px}
.cbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--l2);padding:2px 9px;border-radius:99px;border:1px solid var(--b2);white-space:nowrap}
.chip.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.hint{font-size:11.5px;color:var(--cap);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
.send{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;opacity:.45;flex:none}
.processbtn{display:none}
body[data-hold=&quot;on&quot;] .processbtn{display:inline-flex}
.rt{display:flex;gap:1px}
.rt button{padding:3px 10px;border-radius:7px;font-size:12.5px;color:var(--l3)}
.rt button.on{background:var(--active);color:var(--l1);font-weight:500}
.rpane{display:none;flex-direction:column;gap:12px;padding:10px 12px 14px}
.rpane.on{display:flex}
.sec h4{margin:0 0 5px;font-size:11.5px;font-weight:500;color:var(--l3);display:flex;justify-content:space-between;gap:8px}
.kv{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 8px;font-size:12.5px;margin:0}
.kv dt{color:var(--l3);white-space:nowrap}
.kv dd{margin:0}
.mem{padding:6px 9px;border-radius:9px;background:var(--side);border:1px solid var(--b2);font-size:12.5px;margin-bottom:4px}
.mem small{color:var(--cap);font-size:11px;margin-left:4px}
.seg2{border:1px solid var(--b2);border-radius:10px;margin-bottom:6px;overflow:hidden}
.seg2 b{display:flex;justify-content:space-between;font-size:11.5px;font-weight:500;color:var(--l3);padding:4px 8px;background:var(--side);border-bottom:1px solid var(--b2)}
.seg2 pre{margin:0;padding:6px 8px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:var(--l2);max-height:84px;overflow:hidden}
.bar{height:4px;border-radius:2px;background:var(--active);overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--brand)}

/* 回放视图（示意） */
.rp{max-width:1120px;margin:0 auto;padding:16px 24px 32px;display:flex;flex-direction:column;gap:12px}
.rpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* ---------- 窄屏：左栏抽屉、右栏浮层 ---------- */
.mask{display:none}
.drawer-btn{display:none !important}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .maincol{grid-column:1}
  .leftcol{position:fixed;z-index:40;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .2s;display:flex !important;box-shadow:var(--pop)}
  body[data-drawer=&quot;open&quot;] .leftcol{transform:none}
  .rightcol{position:fixed;z-index:40;right:0;top:0;bottom:0;width:min(340px,92vw);display:none !important;background:var(--bg);box-shadow:var(--pop)}
  body[data-mode=&quot;chat&quot;][data-sheet=&quot;open&quot;] .rightcol{display:flex !important}
  body[data-drawer=&quot;open&quot;] .mask,body[data-sheet=&quot;open&quot;][data-mode=&quot;chat&quot;] .mask{display:block;position:fixed;inset:0;z-index:35;background:var(--mask)}
  .drawer-btn{display:grid !important}
  .expand-left,.collapse-left,.collapse-right{display:none !important}
  .grid2,.hints,.day,.rpgrid{grid-template-columns:minmax(0,1fr)}
  .cfg,.day,.rp{padding:12px 14px 24px}
  .tr{grid-template-columns:30px minmax(0,1fr) 56px 16px}
  .tr .k{display:none}
  .h .hide-narrow{display:none}
  .thread{padding:12px 12px 6px}
  .dock{padding:4px 10px 10px}
  .hint{display:none}
  .topbar{padding:9px 12px;gap:10px}
}


.tabs a{padding:5px 12px;border-radius:7px;color:var(--l3);white-space:nowrap;text-decoration:none}
.tabs a:hover{background:var(--hover);color:var(--l1)}
.tabs a.on{background:var(--active);color:var(--l1);font-weight:600}
.runbtn{margin-left:4px}
.ttl{font-weight:600;font-size:13.5px;flex:1}
/* 表单与设置通用 */
.page{max-width:960px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:14px}
.page.wide{max-width:1180px}
.sec-title{font-size:13px;font-weight:600;margin:4px 0 -4px;display:flex;align-items:center;gap:8px}
.sec-title small{font-weight:400;color:var(--l3);font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--l3)}
.f .in{border:1px solid var(--b2);border-radius:9px;background:var(--bg);padding:6px 10px;font-size:13.5px;color:var(--l1);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-height:34px}
.f .in small{color:var(--cap);margin-left:auto}
.f .in.area{min-height:64px;align-items:flex-start;line-height:1.6;color:var(--l2)}
.f em{font-style:normal;color:var(--cap);font-size:11.5px}
.radios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rc{border:1px solid var(--b2);border-radius:12px;padding:10px 12px;background:var(--bg);display:flex;gap:10px;align-items:flex-start}
.rc.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.rc i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--b3);margin-top:3px;flex:none}
.rc.on i{border:4px solid var(--brand)}
.rc b{font-size:13px}
.rc span{display:block;font-size:12px;color:var(--l3)}
.rows{display:flex;flex-direction:column;border:1px solid var(--b2);border-radius:14px;overflow:hidden;background:var(--bg)}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--b2);font-size:13px;min-width:0}
.row:first-child{border-top:0}
.row .sub{color:var(--l3);font-size:12px}
.row .grow{flex:1;min-width:0}
.row .grow small{display:block;color:var(--l3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.metric span{font-size:12px;color:var(--l3)}
.metric b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.metric small{font-size:11.5px;color:var(--cap)}
.metric.w{background:var(--warn-bg)} .metric.w span,.metric.w small{color:var(--warn)}
.metric.e{background:var(--err-bg)} .metric.e span,.metric.e small{color:var(--err)}
.lv{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok)}
.lv.w{background:var(--warn)} .lv.e{background:var(--err)} .lv.n{background:var(--cap)}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
.split&gt;.page{margin:0;max-width:none;width:100%}
.inner{border-right:1px solid var(--b2);padding:10px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--b2);border-radius:9px;padding:5px 9px;font-size:12.5px;color:var(--cap);margin:0 2px 6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.logrow{display:grid;grid-template-columns:70px 12px 170px minmax(0,1fr);gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--b2);font-size:12.5px}
.logrow:first-child{border-top:0}
.logrow time{color:var(--l3);font-variant-numeric:tabular-nums}
.desk{border-radius:14px;background:#0b0c0f;color:#8b8f97;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:360px;font-size:13px}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow:hidden}
.heat i{border-radius:3px;background:var(--active)}
.heat i.l1{background:#c9dafb} .heat i.l2{background:#93b4f3} .heat i.l3{background:#5b8be8} .heat i.l4{background:#4176e6}
@media (prefers-color-scheme: dark){.heat i.l1{background:#28314a}.heat i.l2{background:#34508a}.heat i.l3{background:#4d73c4}.heat i.l4{background:#7aaaff}}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:3px}
.legend span{margin-left:auto;color:var(--l3);font-variant-numeric:tabular-nums}
@media (max-width:860px){
  .fgrid,.fgrid.two,.radios{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .inner{border-right:0;border-bottom:1px solid var(--b2)}
  .page{padding:12px 14px 28px}
  .logrow{grid-template-columns:56px 10px minmax(0,1fr)}
  .logrow .mono{display:none}
}

.bio code{font-family:inherit;background:var(--bg);border:1px solid var(--b2);border-radius:8px;padding:4px 10px;flex:1}
.hints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:2px 0}
.hrow .num{margin-left:auto;width:64px;text-align:right;border:1px solid var(--b2);border-radius:8px;padding:2px 8px;background:var(--bg);font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--l3);font-size:13px;padding:60px 20px;text-align:center}

/* 日程 */
.day{max-width:1120px;margin:0 auto;padding:16px 24px 32px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.tl{display:flex;flex-direction:column;border:1px solid var(--b2);border-radius:14px;overflow:hidden}
.tl div{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--b2);font-size:13px}
.tl div:first-child{border-top:0}
.tl div span{color:var(--l3);font-variant-numeric:tabular-nums;font-size:12.5px}
.tl div.now{background:var(--sel)}
.tl div.now span{color:var(--brand);font-weight:500}
.kvs{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--active);color:var(--l2)}

/* 试聊 */
.thread{max-width:760px;margin:0 auto;padding:14px 20px 6px;display:flex;flex-direction:column;gap:10px}
.user{align-self:flex-end;display:flex;align-items:flex-end;gap:6px;max-width:80%}
.user .meta{order:-1;padding-bottom:4px}
.bubble{background:var(--bubble);border-radius:18px;padding:7px 14px;line-height:21px;overflow-wrap:anywhere}
.meta{font-size:11.5px;color:var(--cap);display:flex;gap:5px;align-items:center;white-space:nowrap}
.tag{font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--active);color:var(--l2)}
.tag.dm{background:var(--brand-soft);color:var(--brand)}
.turn{display:flex;flex-direction:column;gap:3px;padding:6px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;text-align:left}
.turn:hover{background:var(--hover)}
.turn.sel{background:var(--sel)}
.proc{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--l3)}
.proc .ok{color:var(--ok)}
.proc .hit{font-size:11px;padding:0 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand)}
.proc .d{width:2px;height:2px;border-radius:1px;background:var(--cap)}
.reply{line-height:23px;overflow-wrap:anywhere}
.pills{font-size:11.5px;color:var(--cap);font-variant-numeric:tabular-nums}
.skip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--l3);padding:4px 10px;border:1px dashed var(--b3);border-radius:10px;width:fit-content}
.warnline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:7px;width:fit-content}
.sys{align-self:center;font-size:11.5px;color:var(--l3);padding:2px 10px;border-radius:99px;background:var(--side);border:1px solid var(--b2)}
.merged{font-size:11px;color:var(--cap)}
.dock{flex:none;padding:4px 20px 12px}
.composer{max-width:760px;margin:0 auto;border:1px solid var(--b3);border-radius:16px;background:var(--bg);box-shadow:var(--shadow);padding:8px 8px 6px 12px}
.ph{color:var(--cap);padding:2px 2px 8px}
.cbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--l2);padding:2px 9px;border-radius:99px;border:1px solid var(--b2);white-space:nowrap}
.chip.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.hint{font-size:11.5px;color:var(--cap);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
.send{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;opacity:.45;flex:none}
.processbtn{display:none}
body[data-hold=&quot;on&quot;] .processbtn{display:inline-flex}
.rt{display:flex;gap:1px}
.rt button{padding:3px 10px;border-radius:7px;font-size:12.5px;color:var(--l3)}
.rt button.on{background:var(--active);color:var(--l1);font-weight:500}
.rpane{display:none;flex-direction:column;gap:12px;padding:10px 12px 14px}
.rpane.on{display:flex}
.sec h4{margin:0 0 5px;font-size:11.5px;font-weight:500;color:var(--l3);display:flex;justify-content:space-between;gap:8px}
.kv{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 8px;font-size:12.5px;margin:0}
.kv dt{color:var(--l3);white-space:nowrap}
.kv dd{margin:0}
.mem{padding:6px 9px;border-radius:9px;background:var(--side);border:1px solid var(--b2);font-size:12.5px;margin-bottom:4px}
.mem small{color:var(--cap);font-size:11px;margin-left:4px}
.seg2{border:1px solid var(--b2);border-radius:10px;margin-bottom:6px;overflow:hidden}
.seg2 b{display:flex;justify-content:space-between;font-size:11.5px;font-weight:500;color:var(--l3);padding:4px 8px;background:var(--side);border-bottom:1px solid var(--b2)}
.seg2 pre{margin:0;padding:6px 8px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:var(--l2);max-height:84px;overflow:hidden}
.bar{height:4px;border-radius:2px;background:var(--active);overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--brand)}

/* 回放视图（示意） */
.rp{max-width:1120px;margin:0 auto;padding:16px 24px 32px;display:flex;flex-direction:column;gap:12px}
.rpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* ---------- 窄屏：左栏抽屉、右栏浮层 ---------- */
.mask{display:none}
.drawer-btn{display:none !important}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .maincol{grid-column:1}
  .leftcol{position:fixed;z-index:40;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .2s;display:flex !important;box-shadow:var(--pop)}
  body[data-drawer=&quot;open&quot;] .leftcol{transform:none}
  .rightcol{position:fixed;z-index:40;right:0;top:0;bottom:0;width:min(340px,92vw);display:none !important;background:var(--bg);box-shadow:var(--pop)}
  body[data-mode=&quot;chat&quot;][data-sheet=&quot;open&quot;] .rightcol{display:flex !important}
  body[data-drawer=&quot;open&quot;] .mask,body[data-sheet=&quot;open&quot;][data-mode=&quot;chat&quot;] .mask{display:block;position:fixed;inset:0;z-index:35;background:var(--mask)}
  .drawer-btn{display:grid !important}
  .expand-left,.collapse-left,.collapse-right{display:none !important}
  .grid2,.hints,.day,.rpgrid{grid-template-columns:minmax(0,1fr)}
  .cfg,.day,.rp{padding:12px 14px 24px}
  .tr{grid-template-columns:30px minmax(0,1fr) 56px 16px}
  .tr .k{display:none}
  .h .hide-narrow{display:none}
  .thread{padding:12px 12px 6px}
  .dock{padding:4px 10px 10px}
  .hint{display:none}
  .topbar{padding:9px 12px;gap:10px}
}


.tabs a{padding:5px 12px;border-radius:7px;color:var(--l3);white-space:nowrap;text-decoration:none}
.tabs a:hover{background:var(--hover);color:var(--l1)}
.tabs a.on{background:var(--active);color:var(--l1);font-weight:600}
.runbtn{margin-left:4px}
.ttl{font-weight:600;font-size:13.5px;flex:1}
/* 表单与设置通用 */
.page{max-width:960px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:14px}
.page.wide{max-width:1180px}
.sec-title{font-size:13px;font-weight:600;margin:4px 0 -4px;display:flex;align-items:center;gap:8px}
.sec-title small{font-weight:400;color:var(--l3);font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--l3)}
.f .in{border:1px solid var(--b2);border-radius:9px;background:var(--bg);padding:6px 10px;font-size:13.5px;color:var(--l1);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-height:34px}
.f .in small{color:var(--cap);margin-left:auto}
.f .in.area{min-height:64px;align-items:flex-start;line-height:1.6;color:var(--l2)}
.f em{font-style:normal;color:var(--cap);font-size:11.5px}
.radios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rc{border:1px solid var(--b2);border-radius:12px;padding:10px 12px;background:var(--bg);display:flex;gap:10px;align-items:flex-start}
.rc.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.rc i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--b3);margin-top:3px;flex:none}
.rc.on i{border:4px solid var(--brand)}
.rc b{font-size:13px}
.rc span{display:block;font-size:12px;color:var(--l3)}
.rows{display:flex;flex-direction:column;border:1px solid var(--b2);border-radius:14px;overflow:hidden;background:var(--bg)}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--b2);font-size:13px;min-width:0}
.row:first-child{border-top:0}
.row .sub{color:var(--l3);font-size:12px}
.row .grow{flex:1;min-width:0}
.row .grow small{display:block;color:var(--l3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.metric span{font-size:12px;color:var(--l3)}
.metric b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.metric small{font-size:11.5px;color:var(--cap)}
.metric.w{background:var(--warn-bg)} .metric.w span,.metric.w small{color:var(--warn)}
.metric.e{background:var(--err-bg)} .metric.e span,.metric.e small{color:var(--err)}
.lv{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok)}
.lv.w{background:var(--warn)} .lv.e{background:var(--err)} .lv.n{background:var(--cap)}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
.split&gt;.page{margin:0;max-width:none;width:100%}
.inner{border-right:1px solid var(--b2);padding:10px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--b2);border-radius:9px;padding:5px 9px;font-size:12.5px;color:var(--cap);margin:0 2px 6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.logrow{display:grid;grid-template-columns:70px 12px 170px minmax(0,1fr);gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--b2);font-size:12.5px}
.logrow:first-child{border-top:0}
.logrow time{color:var(--l3);font-variant-numeric:tabular-nums}
.desk{border-radius:14px;background:#0b0c0f;color:#8b8f97;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:360px;font-size:13px}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow:hidden}
.heat i{border-radius:3px;background:var(--active)}
.heat i.l1{background:#c9dafb} .heat i.l2{background:#93b4f3} .heat i.l3{background:#5b8be8} .heat i.l4{background:#4176e6}
@media (prefers-color-scheme: dark){.heat i.l1{background:#28314a}.heat i.l2{background:#34508a}.heat i.l3{background:#4d73c4}.heat i.l4{background:#7aaaff}}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:3px}
.legend span{margin-left:auto;color:var(--l3);font-variant-numeric:tabular-nums}
@media (max-width:860px){
  .fgrid,.fgrid.two,.radios{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .inner{border-right:0;border-bottom:1px solid var(--b2)}
  .page{padding:12px 14px 28px}
  .logrow{grid-template-columns:56px 10px minmax(0,1fr)}
  .logrow .mono{display:none}
}

&lt;style&gt;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--l1);font:14px/1.55 -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 面板顶栏（本提案不变） ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:16px;padding:9px 20px;background:var(--topbar);border-bottom:1px solid var(--panel-border);min-width:0}
.topbar b{font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow:auto}
.tabs span{padding:5px 12px;border-radius:7px;color:var(--l3);white-space:nowrap}

.state{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}

/* ---------- 工作区：左栏 + 主区 + 可选右栏 ---------- */
body[data-mode=&quot;chat&quot;]{--rw:288px}
body[data-left=&quot;closed&quot;]{--lw:0px}
body[data-right=&quot;closed&quot;]{--rw:0px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);position:relative}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.leftcol{grid-column:1;background:var(--side);border-right:1px solid var(--b2)}
.maincol{grid-column:2}
.rightcol{grid-column:3;border-left:1px solid var(--b2)}
body[data-left=&quot;closed&quot;] .leftcol,body[data-right=&quot;closed&quot;] .rightcol,body:not([data-mode=&quot;chat&quot;]) .rightcol{display:none}
.h{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-bottom:1px solid var(--b2);min-width:0}
.body{flex:1;min-height:0;overflow:auto}
[data-m]{display:none !important}
body[data-mode=&quot;persona&quot;] [data-m~=&quot;persona&quot;],body[data-mode=&quot;daily&quot;] [data-m~=&quot;daily&quot;],body[data-mode=&quot;chat&quot;] [data-m~=&quot;chat&quot;]{display:flex !important}
:not(body)[data-pv]{display:none !important}
body[data-pv=&quot;edit&quot;] [data-pv~=&quot;edit&quot;],body[data-pv=&quot;preset&quot;] [data-pv~=&quot;preset&quot;],body[data-pv=&quot;hints&quot;] [data-pv~=&quot;hints&quot;],body[data-pv=&quot;replay&quot;] [data-pv~=&quot;replay&quot;]{display:flex !important}
:not(body)[data-dv]{display:none !important}
body[data-dv=&quot;today&quot;] [data-dv~=&quot;today&quot;],body[data-dv=&quot;past&quot;] [data-dv~=&quot;past&quot;]{display:flex !important}
.expand-left{display:none !important}
body[data-left=&quot;closed&quot;] .expand-left{display:grid !important}

.seg{display:inline-flex;padding:2px;gap:1px;background:var(--active);border-radius:8px;flex:1}
.seg button{flex:1;padding:3px 0;border-radius:6px;color:var(--l3);font-size:12.5px}
.seg button.on{background:var(--bg);color:var(--l1);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:500}
.iconbtn{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;color:var(--l2);flex:none;position:relative}
.iconbtn:hover,.iconbtn.on{background:var(--hover)}

.sp{flex:1}

.hrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:2px 0}
.hrow .num{margin-left:auto;width:64px;text-align:right;border:1px solid var(--b2);border-radius:8px;padding:2px 8px;background:var(--bg);font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--l3);font-size:13px;padding:60px 20px;text-align:center}

/* 日程 */
.day{max-width:1120px;margin:0 auto;padding:16px 24px 32px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.tl{display:flex;flex-direction:column;border:1px solid var(--b2);border-radius:14px;overflow:hidden}
.tl div{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--b2);font-size:13px}
.tl div:first-child{border-top:0}
.tl div span{color:var(--l3);font-variant-numeric:tabular-nums;font-size:12.5px}
.tl div.now{background:var(--sel)}
.tl div.now span{color:var(--brand);font-weight:500}
.kvs{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--active);color:var(--l2)}

/* 试聊 */
.thread{max-width:760px;margin:0 auto;padding:14px 20px 6px;display:flex;flex-direction:column;gap:10px}
.user{align-self:flex-end;display:flex;align-items:flex-end;gap:6px;max-width:80%}
.user .meta{order:-1;padding-bottom:4px}
.bubble{background:var(--bubble);border-radius:18px;padding:7px 14px;line-height:21px;overflow-wrap:anywhere}
.meta{font-size:11.5px;color:var(--cap);display:flex;gap:5px;align-items:center;white-space:nowrap}
.tag{font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--active);color:var(--l2)}
.tag.dm{background:var(--brand-soft);color:var(--brand)}
.turn{display:flex;flex-direction:column;gap:3px;padding:6px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;text-align:left}
.turn:hover{background:var(--hover)}
.turn.sel{background:var(--sel)}
.proc{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--l3)}
.proc .ok{color:var(--ok)}
.proc .hit{font-size:11px;padding:0 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand)}
.proc .d{width:2px;height:2px;border-radius:1px;background:var(--cap)}
.reply{line-height:23px;overflow-wrap:anywhere}
.pills{font-size:11.5px;color:var(--cap);font-variant-numeric:tabular-nums}
.skip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--l3);padding:4px 10px;border:1px dashed var(--b3);border-radius:10px;width:fit-content}
.warnline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:7px;width:fit-content}
.sys{align-self:center;font-size:11.5px;color:var(--l3);padding:2px 10px;border-radius:99px;background:var(--side);border:1px solid var(--b2)}
.merged{font-size:11px;color:var(--cap)}
.dock{flex:none;padding:4px 20px 12px}
.composer{max-width:760px;margin:0 auto;border:1px solid var(--b3);border-radius:16px;background:var(--bg);box-shadow:var(--shadow);padding:8px 8px 6px 12px}
.ph{color:var(--cap);padding:2px 2px 8px}
.cbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--l2);padding:2px 9px;border-radius:99px;border:1px solid var(--b2);white-space:nowrap}
.chip.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.hint{font-size:11.5px;color:var(--cap);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
.send{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;opacity:.45;flex:none}
.processbtn{display:none}
body[data-hold=&quot;on&quot;] .processbtn{display:inline-flex}
.rt{display:flex;gap:1px}
.rt button{padding:3px 10px;border-radius:7px;font-size:12.5px;color:var(--l3)}
.rt button.on{background:var(--active);color:var(--l1);font-weight:500}
.rpane{display:none;flex-direction:column;gap:12px;padding:10px 12px 14px}
.rpane.on{display:flex}
.sec h4{margin:0 0 5px;font-size:11.5px;font-weight:500;color:var(--l3);display:flex;justify-content:space-between;gap:8px}
.kv{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 8px;font-size:12.5px;margin:0}
.kv dt{color:var(--l3);white-space:nowrap}
.kv dd{margin:0}
.mem{padding:6px 9px;border-radius:9px;background:var(--side);border:1px solid var(--b2);font-size:12.5px;margin-bottom:4px}
.mem small{color:var(--cap);font-size:11px;margin-left:4px}
.seg2{border:1px solid var(--b2);border-radius:10px;margin-bottom:6px;overflow:hidden}
.seg2 b{display:flex;justify-content:space-between;font-size:11.5px;font-weight:500;color:var(--l3);padding:4px 8px;background:var(--side);border-bottom:1px solid var(--b2)}
.seg2 pre{margin:0;padding:6px 8px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:var(--l2);max-height:84px;overflow:hidden}
.bar{height:4px;border-radius:2px;background:var(--active);overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--brand)}

/* 回放视图（示意） */
.rp{max-width:1120px;margin:0 auto;padding:16px 24px 32px;display:flex;flex-direction:column;gap:12px}
.rpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* ---------- 窄屏：左栏抽屉、右栏浮层 ---------- */
.mask{display:none}
.drawer-btn{display:none !important}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .maincol{grid-column:1}
  .leftcol{position:fixed;z-index:40;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .2s;display:flex !important;box-shadow:var(--pop)}
  body[data-drawer=&quot;open&quot;] .leftcol{transform:none}
  .rightcol{position:fixed;z-index:40;right:0;top:0;bottom:0;width:min(340px,92vw);display:none !important;background:var(--bg);box-shadow:var(--pop)}
  body[data-mode=&quot;chat&quot;][data-sheet=&quot;open&quot;] .rightcol{display:flex !important}
  body[data-drawer=&quot;open&quot;] .mask,body[data-sheet=&quot;open&quot;][data-mode=&quot;chat&quot;] .mask{display:block;position:fixed;inset:0;z-index:35;background:var(--mask)}
  .drawer-btn{display:grid !important}
  .expand-left,.collapse-left,.collapse-right{display:none !important}
  .grid2,.hints,.day,.rpgrid{grid-template-columns:minmax(0,1fr)}
  .cfg,.day,.rp{padding:12px 14px 24px}
  .tr{grid-template-columns:30px minmax(0,1fr) 56px 16px}
  .tr .k{display:none}
  .h .hide-narrow{display:none}
  .thread{padding:12px 12px 6px}
  .dock{padding:4px 10px 10px}
  .hint{display:none}
  .topbar{padding:9px 12px;gap:10px}
}


.tabs a{padding:5px 12px;border-radius:7px;color:var(--l3);white-space:nowrap;text-decoration:none}
.tabs a:hover{background:var(--hover);color:var(--l1)}
.tabs a.on{background:var(--active);color:var(--l1);font-weight:600}
.runbtn{margin-left:4px}
.ttl{font-weight:600;font-size:13.5px;flex:1}
/* 表单与设置通用 */
.page{max-width:960px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:14px}
.page.wide{max-width:1180px}
.sec-title{font-size:13px;font-weight:600;margin:4px 0 -4px;display:flex;align-items:center;gap:8px}
.sec-title small{font-weight:400;color:var(--l3);font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--l3)}
.f .in{border:1px solid var(--b2);border-radius:9px;background:var(--bg);padding:6px 10px;font-size:13.5px;color:var(--l1);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-height:34px}
.f .in small{color:var(--cap);margin-left:auto}
.f .in.area{min-height:64px;align-items:flex-start;line-height:1.6;color:var(--l2)}
.f em{font-style:normal;color:var(--cap);font-size:11.5px}
.radios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rc{border:1px solid var(--b2);border-radius:12px;padding:10px 12px;background:var(--bg);display:flex;gap:10px;align-items:flex-start}
.rc.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.rc i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--b3);margin-top:3px;flex:none}
.rc.on i{border:4px solid var(--brand)}
.rc b{font-size:13px}
.rc span{display:block;font-size:12px;color:var(--l3)}
.rows{display:flex;flex-direction:column;border:1px solid var(--b2);border-radius:14px;overflow:hidden;background:var(--bg)}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--b2);font-size:13px;min-width:0}
.row:first-child{border-top:0}
.row .sub{color:var(--l3);font-size:12px}
.row .grow{flex:1;min-width:0}
.row .grow small{display:block;color:var(--l3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.metric span{font-size:12px;color:var(--l3)}
.metric b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.metric small{font-size:11.5px;color:var(--cap)}
.metric.w{background:var(--warn-bg)} .metric.w span,.metric.w small{color:var(--warn)}
.metric.e{background:var(--err-bg)} .metric.e span,.metric.e small{color:var(--err)}
.lv{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok)}
.lv.w{background:var(--warn)} .lv.e{background:var(--err)} .lv.n{background:var(--cap)}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
.split&gt;.page{margin:0;max-width:none;width:100%}
.inner{border-right:1px solid var(--b2);padding:10px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--b2);border-radius:9px;padding:5px 9px;font-size:12.5px;color:var(--cap);margin:0 2px 6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.logrow{display:grid;grid-template-columns:70px 12px 170px minmax(0,1fr);gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--b2);font-size:12.5px}
.logrow:first-child{border-top:0}
.logrow time{color:var(--l3);font-variant-numeric:tabular-nums}
.desk{border-radius:14px;background:#0b0c0f;color:#8b8f97;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:360px;font-size:13px}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow:hidden}
.heat i{border-radius:3px;background:var(--active)}
.heat i.l1{background:#c9dafb} .heat i.l2{background:#93b4f3} .heat i.l3{background:#5b8be8} .heat i.l4{background:#4176e6}
@media (prefers-color-scheme: dark){.heat i.l1{background:#28314a}.heat i.l2{background:#34508a}.heat i.l3{background:#4d73c4}.heat i.l4{background:#7aaaff}}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:3px}
.legend span{margin-left:auto;color:var(--l3);font-variant-numeric:tabular-nums}
@media (max-width:860px){
  .fgrid,.fgrid.two,.radios{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .inner{border-right:0;border-bottom:1px solid var(--b2)}
  .page{padding:12px 14px 28px}
  .logrow{grid-template-columns:56px 10px minmax(0,1fr)}
  .logrow .mono{display:none}
}
